name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@dca8468d37b6d090cde2c7b97b738a37134f5ffb # v.5.4.0
      with:
        go-version-file: 'go.mod'

    - name: Run tests
      run: go test ./... -v -race
