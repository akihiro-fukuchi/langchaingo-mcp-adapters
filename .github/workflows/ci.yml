name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Go
      uses: actions/setup-go@dca8468d37b6d090cde2c7b97b738a37134f5ffb # v.5.4.0
      with:
        go-version-file: 'go.mod'

    - name: Run tests
      run: go test ./... -v -race
