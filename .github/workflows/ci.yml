name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@dca8468d37b6d090cde2c7b97b738a37134f5ffb # v.5.4.0
      with:
        go-version-file: 'go.mod'

    - name: Run tests
      run: go test ./... -v -race
